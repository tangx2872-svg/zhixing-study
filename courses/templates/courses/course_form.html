{% extends 'courses/course_base.html' %}
{% load bootstrap4 %}
{% block title_name %}在线学习平台 - {% if object %}编辑课程{% else %}创建课程{% endif %}{% endblock %}
{% block main_content %}
<h1>{% if object %}编辑课程{% else %}创建课程{% endif %}</h1>
<form method="post">{% csrf_token %}{% bootstrap_form form %}
<button class="btn btn-success" type="submit">保存课程</button>
<a class="btn btn-secondary" href="{% url 'courses:list' %}">返回课程列表</a>
</form>
{% endblock %}
