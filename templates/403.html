{% extends 'base.html' %}
{% block title %}在线学习平台 - 无法执行操作{% endblock %}
{% block body_content %}<div class="container"><h1>无法执行此操作</h1><p>{{ exception|default:"您没有权限访问此内容。" }}</p><a class="btn btn-primary" href="{% url 'courses:list' %}">返回课程列表</a>{% if user.is_authenticated %} <a class="btn btn-secondary" href="{% url 'profile' pk=user.pk %}">返回个人页</a>{% endif %}</div>{% endblock %}
