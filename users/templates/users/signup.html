{% extends 'base.html' %}
{% load bootstrap4 %}
{% block title %}苏州工学院 · 注册{% endblock %}
{% block body_content %}
<div class="page-heading"><div><p class="eyebrow">JOIN / 加入学习空间</p><h1>注册账号</h1><p class="page-description">填写基本信息，选择你的教学或学习身份。</p></div><a href="{% url 'users:login' %}" class="btn btn-outline-secondary">已有账号，去登录</a></div>
<form method="post" class="registration-form">{% csrf_token %}{% bootstrap_form form %}<button type="submit" class="btn btn-primary">注册</button></form>
{% endblock %}
